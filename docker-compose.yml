services:
  dev-container:
    container_name: ${INSTANCE:-dev-container}
    hostname: ${INSTANCE:-dev-container}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-base}
      args:
        USERNAME: ${USERNAME:-$USER}
        DOTFILES_REPO: ${DOTFILES_REPO:-}
        DOTFILES_INSTALL_CMD: ${DOTFILES_INSTALL_CMD:-./install.sh}
    image: dev-container:${INSTANCE:-dev-container}-${BUILD_TARGET:-base}
    ports:
      - "127.0.0.1:${SSH_PORT:-2222}:22"
    environment:
      - SSH_AUTHORIZED_KEYS
      - TZ
      - CODE_DIR
    volumes:
      - home:/home/${USERNAME:-$USER}
      - ${CODE_DIR:?Set CODE_DIR in .env}:${CODE_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/certs:/usr/local/share/ca-certificates/extra:ro
      - /etc/localtime:/etc/localtime:ro
    restart: always

volumes:
  home:
